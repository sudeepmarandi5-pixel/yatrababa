    <script>
      (function() {
        try {
          var _origFetch = window.fetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return _origFetch;
            },
            set: function(val) {
              _origFetch = val;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          // If already defined or error, fallback to property value
          try {
            Object.defineProperty(window, 'fetch', {
              value: window.fetch,
              writable: true,
              configurable: true,
              enumerable: true
            });
          } catch (err) {}
        }
      })();
    </script>
